<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>LIVAUTH</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #111;
        }
        /* Only shown if the app never picks up the handoff. */
        #fallback {
            display: none;
            height: 100%;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        #fallback a {
            color: #ccc;
            font-size: 13px;
            text-decoration: none;
            border-bottom: 1px solid #555;
        }
    </style>
</head>
<body>
    <div id="fallback"><a id="manualLink" href="#">Return to game</a></div>

    <script>
        (function () {
            const APP_SCHEME = 'viellci://patreon-callback';
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');
            const error = params.get('error');

            if (window.history && window.history.replaceState) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (!code && !error) {
                return;
            }

            const qp = new URLSearchParams();
            if (code) qp.set('code', code);
            if (state) qp.set('state', state);
            if (error) qp.set('error', error);
            const deepLink = APP_SCHEME + '?' + qp.toString();

            window.location.href = deepLink;

            setTimeout(function () {
                const link = document.getElementById('manualLink');
                link.href = deepLink;
                document.getElementById('fallback').style.display = 'flex';
            }, 1500);
        })();
    </script>
</body>
</html>
